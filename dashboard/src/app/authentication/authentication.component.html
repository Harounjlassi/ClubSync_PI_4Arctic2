<!-- authentication.component.html -->
<div class="login-container">
  <img src="" alt="Profile" class="profile-img">
  <h2 class="login-title">Login</h2>
  
  <!-- Login Form -->
  <div *ngIf="!isLoggedIn" id="loginForm">
    <form name="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email address</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          name="email"
          [(ngModel)]="form.email" 
          required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          name="password"
          [(ngModel)]="form.password" 
          required>
        <a href="javascript:void(0)" class="forgot-password">Forgot password?</a>
      </div>
      
      <button type="submit" class="login-btn">
        Sign In
      </button>
      
      <div *ngIf="isLoginFailed" class="alert alert-danger">
        {{ errorMessage }}
      </div>
    </form>
    
    <div class="register-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </div>
  </div>
  
  <!-- Message after successful login -->
  <div *ngIf="isLoggedIn" class="alert alert-success">
    Logged in as {{ roles}}.
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</div>
