<div *ngIf="book">
  <h2>Update Book</h2>
  <form (ngSubmit)="updateBook()" #bookForm="ngForm">
    <div>
      <label for="title">Title</label>
      <input type="text" [(ngModel)]="book.title" name="title" required />
    </div>
    <div>
      <label for="author">Author</label>
      <input type="text" [(ngModel)]="book.author" name="author" required />
    </div>
    <div>
      <label for="isbn">ISBN</label>
      <input type="text" [(ngModel)]="book.isbn" name="isbn" required />
    </div>
    <div>
      <label for="publisher">Publisher</label>
      <input type="text" [(ngModel)]="book.publisher" name="publisher" />
    </div>
    <div>
      <label for="publicationDate">Publication Date</label>
      <input type="date" [(ngModel)]="book.publicationDate" name="publicationDate" />
    </div>
    <div>
      <label for="genre">Genre</label>
      <input type="text" [(ngModel)]="book.genre" name="genre" />
    </div>
    <div>
      <label for="description">Description</label>
      <textarea [(ngModel)]="book.description" name="description"></textarea>
    </div>
    <button type="submit" [disabled]="isSubmitting">Update Book</button>
  </form>

  <div *ngIf="errorMessage">
    <p>{{ errorMessage }}</p>
  </div>
</div>
