
<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-12">
<div class="projects-horizontal-container">
<div *ngFor="let tempProjet of projectsWithColors" class="project-card-container">
    <div class="project-card">
      <!-- Card Header -->
      <div class="card-header" [style.background]="tempProjet.cardColor + ' !important'">        <div class="header-content">
          <div class="project-meta">
            <span class="project-id">PROJ-1024</span>
            <span class="project-priority high-priority">High Priority</span>
          </div>
          <h3 class="project-title">{{tempProjet.nom}}</h3>
        </div>
        <div class="project-status in-progress">
          <svg class="status-icon" viewBox="0 0 32 32" width="28" height="28"  [innerHTML]="getSanitizedSvg(tempProjet.status)"></svg>
          <span> {{tempProjet.status}}</span>
        </div>
      </div>
  
      <!-- Card Body -->
      <div class="card-body">
        <p class="project-description">
          Complete redesign of corporate website with modern UI/UX, improved accessibility, and CMS integration.
        </p>
        
        <!-- Progress Section -->
        <div class="progress-section">
          <div class="progress-info">
            <span>Progress</span>
            <span class="progress-percent">65%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width: 65%"></div>
          </div>
          <div class="progress-dates">
            <span>Start: Jun 1, 2023</span>
            <span>Deadline: Dec 15, 2023</span>
          </div>
        </div>
  
        <!-- Team Section -->
        <div class="team-section">
          <div class="section-header">
            <span>Team Members</span>
            <button class="btn-add-member">
              <svg viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
            </button>
          </div>
          <div class="team-avatars">
            <div class="avatar">
              <img src="https://i.pravatar.cc/150?img=5" alt="Sarah Johnson">
              <span class="avatar-badge designer"></span>
            </div>
            <div class="avatar">
              <img src="https://i.pravatar.cc/150?img=11" alt="Michael Chen">
              <span class="avatar-badge developer"></span>
            </div>
            <div class="avatar">
              <img src="https://i.pravatar.cc/150?img=8" alt="Emma Wilson">
              <span class="avatar-badge pm"></span>
            </div>
            <div class="avatar more-members">+2</div>
          </div>
        </div>
      </div>
  
      <!-- Card Footer -->
      <div class="card-footer">
        <div class="footer-actions">
          <button class="btn-action btn-reports" (click)="showProjectReports(tempProjet)">
            <svg class="report-icon" viewBox="0 0 24 24">
              <!-- Main document shape -->
              <path class="report-sheet" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
              <!-- Fold corner -->
              <path class="report-fold" d="M14 2v6h6"/>
              <!-- Chart line 1 -->
              <path class="report-chart" d="M8 14h2v4H8z"/>
              <!-- Chart line 2 -->
              <path class="report-chart" d="M12 10h2v8h-2z"/>
              <!-- Chart line 3 -->
              <path class="report-chart" d="M16 12h2v6h-2z"/>
              <!-- Animation elements -->
              <animateTransform 
                xlink:href=".report-chart"
                attributeName="transform"
                type="translateY"
                values="0; -2; 0"
                dur="2s"
                repeatCount="indefinite"
              />
              <animate 
                xlink:href=".report-fold"
                attributeName="opacity"
                values="1; 0.7; 1"
                dur="3s"
                repeatCount="indefinite"
              />
            </svg>
            <span class="btn-text">Reports</span>
            <span class="btn-ripple"></span>
          </button>
          <button class="btn-action btn-tasks" (click)="showProjectTasks(tempProjet)">
            <svg viewBox="0 0 24 24">
              <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span>Tasks</span>
          </button>
          <button class="btn-action btn-edit">
            <svg viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            <span>Edit</span>
          </button>
          <!-- <button class="btn-action btn-share">
            <svg viewBox="0 0 24 24">
              <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
            <span>Share</span>
          </button> -->
          <button class="btn-action btn-delete" (click)="projetRports()">
            <svg viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
            <span>Delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  </div>
  </div>
  </div>
  </div>
  </div>
